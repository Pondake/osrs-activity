blueprint:
  name: OSRS XP on a Pixoo 64
  description: >-
    Draws what you are training on a Divoom Pixoo 64.


    Three screens, picked automatically from what the XP session sensor reports:
    a combat screen when everything gaining XP is a combat skill, a single-skill
    screen when you are focused on one thing, and a bar chart for anything else.


    On a slayer task the combat screen names the task and counts down what is
    left of it, if you have switched Slayer task on in the RuneLite plugin.


    With Quest progress switched on there as well, a quest screen names the
    quest you are on while you are working through it, and completing one
    gets a few seconds of confetti before the panel goes back to work.


    Redraws itself whenever the XP session sensor changes, so creating it is
    all there is to it.


    When nothing is gaining XP it does nothing and leaves whatever is on the
    panel alone, so it can share a Pixoo with your other automations.


    Needs the `osrs_activity` integration and `gickowtf/pixoo-homeassistant`,
    which is in the default HACS store.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/Pondake/osrs-activity/blob/main/custom_components/osrs_activity/blueprints/automation/osrs_pixoo64.yaml
  input:
    panel:
      name: Pixoo page
      description: The current-page sensor of your Pixoo, which is what divoom_pixoo draws to.
      selector:
        entity:
          integration: divoom_pixoo
          domain: sensor
    activity:
      name: Activity sensor
      description: >-
        The "Activity" sensor from OSRS Activity — the one whose state is a
        number of skills. Not "XP gained"; that one holds a total and this will
        refuse to draw from it.
      selector:
        entity:
          integration: osrs_activity
          domain: sensor
    only_when:
      name: Only draw when
      description: >-
        Optional. Extra conditions that all have to hold before anything is
        drawn. If something else shares this panel and decides what belongs on
        it, put that decision here — an input_select that has to be on "Auto",
        say. Without it, this draws whenever there is something to draw and the
        last automation to push wins.
      default: []
      selector:
        condition:
    standby:
      name: Standby screen
      description: >-
        What to draw while you are logged in but nothing is gaining XP. On, you
        get your name with health and prayer. Off, the panel is left exactly as
        it was, which is what you want if another automation shares it.
      default: true
      selector:
        boolean:
    quests:
      name: Quests
      icon: mdi:script-text
      description: >-
        Both need Quest progress switched on in the RuneLite plugin; without
        it there is nothing to draw and these do nothing.
      collapsed: true
      input:
        quest_screen:
          name: Quest screen
          description: >-
            Name the quest you are on. Drawn while a step of it landed
            recently, and in place of the standby screen while one is in
            progress and nothing is gaining XP.
          default: true
          selector:
            boolean:
        celebrate:
          name: Celebrate a completed quest
          description: >-
            A few seconds of confetti when a quest is completed. Honours
            Only draw when like everything else here, so a panel that is
            someone else's at that moment stays theirs.
          default: true
          selector:
            boolean:
        celebrate_buzzer:
          name: Buzz on completion
          description: >-
            Sound the Pixoo's buzzer with the confetti. Off by default; the
            device's own integration warns the buzzer may not be good for it.
          default: false
          selector:
            boolean:
    styling:
      name: Styling
      icon: mdi:palette
      collapsed: true
      input:
        background:
          name: Background
          default: [42, 34, 24]
          selector:
            color_rgb:
        accent:
          name: Accent
          description: Headings and the single-skill bar fall back to this.
          default: [255, 152, 31]
          selector:
            color_rgb:
        min_interval:
          name: Minimum time between pushes
          description: >-
            The script ends on a wait of this long, so two calls can never land
            on the device inside it. One second is the figure the vendor gives,
            and it sits twelve times under where a Pixoo 64 was measured to
            freeze. Lower is possible, but it is the only margin there is.
          default: 1
          selector:
            number:
              min: 0.2
              max: 5
              step: 0.1
              unit_of_measurement: s
              mode: box

# Every publish of the sensor is a redraw. The integration only writes when
# something actually changed, so this does not fire on a timer.
triggers:
  - trigger: state
    entity_id: !input activity

# Whatever the user said has to be true before this panel is theirs to draw on.
conditions: !input only_when

# queued rather than single: single drops a trigger that arrives mid-run, which
# shows up as the panel being a minute behind. max 2 keeps the backlog short.
mode: queued
max: 2
max_exceeded: silent

variables:
  activity: !input activity
  bg: !input background
  accent: !input accent
  floor: !input min_interval
  standby: !input standby
  quest_screen: !input quest_screen
  celebrate: !input celebrate
  celebrate_buzzer: !input celebrate_buzzer

  rows: "{{ state_attr(activity, 'skills') or [] }}"
  top: "{{ state_attr(activity, 'top') or {} }}"
  active: "{{ states(activity) | int(0) }}"
  focus_n: "{{ state_attr(activity, 'focus_n') | int(0) }}"
  combat: "{{ state_attr(activity, 'combat') | default(false, true) }}"
  idle: "{{ state_attr(activity, 'idle') | default(false, true) }}"
  gained: "{{ state_attr(activity, 'total_gained_short') | default('0', true) }}"
  per_hour: "{{ state_attr(activity, 'per_hour') | int(0) }}"
  online: "{{ state_attr(activity, 'online') | default(false, true) }}"
  account: "{{ state_attr(activity, 'account') | default('OSRS', true) }}"

  # What is left of the slayer task, or 0 when there is no task to read. Empty
  # unless the Slayer task toggle is on in the RuneLite plugin, which it is not
  # by default -- so the combat screen falls back to the kill count guessed
  # from the XP, and neither is drawn when there is nothing to draw.
  task_left: "{{ (state_attr(activity, 'slayer') or {}).get('remaining') | int(0) }}"
  task_kills: "{{ state_attr(activity, 'slayer_kills') | int(0) }}"

  # The quest last touched, with its name already wrapped to lines that fit
  # the panel, and the two flags the integration raises on it: questing while
  # a step landed inside the session window, celebrating for a few seconds
  # after a completion. All empty unless Quest progress is on in the plugin.
  quest: "{{ state_attr(activity, 'quest') or {} }}"
  quest_lines: "{{ quest.get('lines') or [] }}"
  questing: "{{ quest_screen and (state_attr(activity, 'questing') | default(false, true)) }}"
  celebrating: "{{ celebrate and (state_attr(activity, 'celebrating') | default(false, true)) }}"
  done: "{{ state_attr(activity, 'quest_complete') or {} }}"
  done_lines: "{{ done.get('lines') or [] }}"
  quest_count: >-
    {% if (quest.get('total') | int(0)) > 0 %}{{ quest.get('completed') | int(0) }}/{{ quest.get('total') | int(0) }}{% endif %}

  # Confetti for the celebration: two scatters that alternate frame by frame,
  # and a palette that shifts one step each frame so nothing sits still.
  # Every dot sits in a margin or between two lines of text, so none of it
  # lands on a letter.
  confetti_a: [[0, 0], [10, 0], [52, 0], [62, 1], [0, 8], [62, 9], [1, 27], [20, 28], [42, 27], [61, 28], [0, 40], [62, 44], [8, 52], [30, 53], [50, 52], [62, 54]]
  confetti_b: [[5, 0], [30, 0], [58, 0], [0, 4], [62, 5], [0, 20], [62, 22], [8, 28], [33, 28], [54, 27], [0, 35], [62, 38], [0, 48], [18, 53], [40, 54], [57, 52]]
  confetti_colours: [[255, 215, 0], [255, 80, 80], [80, 255, 120], [90, 170, 255], [255, 120, 200], [60, 220, 220], [255, 255, 255], [255, 152, 31]]

  # The integration resolves health and prayer itself -- it already knows which
  # player this is. -1 means it found no such sensor, which draws in the
  # background colour and so draws nothing.
  hp_pct: "{{ state_attr(activity, 'health_pct') | int(-1) }}"
  pray_pct: "{{ state_attr(activity, 'prayer_pct') | int(-1) }}"
  hp_color: >-
    {% set p = hp_pct | int(-1) %}
    {% if p < 0 %}{{ bg }}{% elif p > 50 %}[0,220,60]
    {% elif p > 25 %}[255,180,0]{% else %}[255,40,40]{% endif %}

actions:
  # Every screen below reads the Activity sensor's attributes, so a sensor
  # without them is the wrong one and drawing from it produces nonsense rather
  # than nothing. Checked first, before anything is put on the panel.
  - condition: template
    value_template: "{{ state_attr(activity, 'window_skills') is not none }}"

  # Nothing training and no standby screen means leave the panel alone, so
  # another automation can own it without this one blanking it. A quest step
  # and a completion count as something to draw: questing grants no XP, so
  # without this a quester would never see their screen.
  - condition: template
    value_template: "{{ celebrating or questing or active >= 1 or (standby and online) }}"

  - choose:
      # ----------------------------------------------------------- celebration
      # A quest was just completed. Four frames of confetti, a floor apart,
      # then this run ends; the integration keeps the flag up for a while
      # longer, so anything that redraws in the meantime celebrates again,
      # and the flag dropping is what sends the panel back to work. The
      # headings are ELEVEN_PIX, the one font here that reads as a shout.
      - conditions: "{{ celebrating }}"
        sequence:
          - if: "{{ celebrate_buzzer }}"
            then:
              - action: divoom_pixoo.play_buzzer
                continue_on_error: true
                target:
                  entity_id: !input panel
                data:
                  buzz_cycle_time_millis: 150
                  idle_cycle_time_millis: 100
                  total_time: 1000
          - repeat:
              count: 4
              sequence:
                - variables:
                    dots: "{{ confetti_a if repeat.index is odd else confetti_b }}"
                    shout: "{% if repeat.index is odd %}[255,215,0]{% else %}[255,255,255]{% endif %}"
                    shout_2: "{% if repeat.index is odd %}[255,255,255]{% else %}[255,215,0]{% endif %}"
                - action: divoom_pixoo.show_message
                  continue_on_error: true
                  target:
                    entity_id: !input panel
                  data:
                    page_data:
                      page_type: components
                      components:
                        - type: rectangle
                          position: [0, 0]
                          size: [64, 64]
                          color: "{{ bg }}"
                          filled: true
                        - type: rectangle
                          position: "{{ dots[0] }}"
                          size: [2, 2]
                          color: "{{ confetti_colours[(0 + repeat.index) % 8] }}"
                          filled: true
                        - type: rectangle
                          position: "{{ dots[1] }}"
                          size: [2, 2]
                          color: "{{ confetti_colours[(1 + repeat.index) % 8] }}"
                          filled: true
                        - type: rectangle
                          position: "{{ dots[2] }}"
                          size: [2, 2]
                          color: "{{ confetti_colours[(2 + repeat.index) % 8] }}"
                          filled: true
                        - type: rectangle
                          position: "{{ dots[3] }}"
                          size: [2, 2]
                          color: "{{ confetti_colours[(3 + repeat.index) % 8] }}"
                          filled: true
                        - type: rectangle
                          position: "{{ dots[4] }}"
                          size: [2, 2]
                          color: "{{ confetti_colours[(4 + repeat.index) % 8] }}"
                          filled: true
                        - type: rectangle
                          position: "{{ dots[5] }}"
                          size: [2, 2]
                          color: "{{ confetti_colours[(5 + repeat.index) % 8] }}"
                          filled: true
                        - type: rectangle
                          position: "{{ dots[6] }}"
                          size: [2, 2]
                          color: "{{ confetti_colours[(6 + repeat.index) % 8] }}"
                          filled: true
                        - type: rectangle
                          position: "{{ dots[7] }}"
                          size: [2, 2]
                          color: "{{ confetti_colours[(7 + repeat.index) % 8] }}"
                          filled: true
                        - type: rectangle
                          position: "{{ dots[8] }}"
                          size: [2, 2]
                          color: "{{ confetti_colours[(8 + repeat.index) % 8] }}"
                          filled: true
                        - type: rectangle
                          position: "{{ dots[9] }}"
                          size: [2, 2]
                          color: "{{ confetti_colours[(9 + repeat.index) % 8] }}"
                          filled: true
                        - type: rectangle
                          position: "{{ dots[10] }}"
                          size: [2, 2]
                          color: "{{ confetti_colours[(10 + repeat.index) % 8] }}"
                          filled: true
                        - type: rectangle
                          position: "{{ dots[11] }}"
                          size: [2, 2]
                          color: "{{ confetti_colours[(11 + repeat.index) % 8] }}"
                          filled: true
                        - type: rectangle
                          position: "{{ dots[12] }}"
                          size: [2, 2]
                          color: "{{ confetti_colours[(12 + repeat.index) % 8] }}"
                          filled: true
                        - type: rectangle
                          position: "{{ dots[13] }}"
                          size: [2, 2]
                          color: "{{ confetti_colours[(13 + repeat.index) % 8] }}"
                          filled: true
                        - type: rectangle
                          position: "{{ dots[14] }}"
                          size: [2, 2]
                          color: "{{ confetti_colours[(14 + repeat.index) % 8] }}"
                          filled: true
                        - type: rectangle
                          position: "{{ dots[15] }}"
                          size: [2, 2]
                          color: "{{ confetti_colours[(15 + repeat.index) % 8] }}"
                          filled: true
                        - type: text
                          content: QUEST
                          position: [32, 3]
                          font: ELEVEN_PIX
                          color: "{{ shout }}"
                          align: center
                        - type: text
                          content: COMPLETE
                          position: [32, 16]
                          font: ELEVEN_PIX
                          color: "{{ shout_2 }}"
                          align: center
                        - type: text
                          content: "{{ done_lines[0] if done_lines | count > 0 else '' }}"
                          position: [32, 31]
                          font: PICO_8
                          color: [255, 235, 200]
                          align: center
                        - type: text
                          content: "{{ done_lines[1] if done_lines | count > 1 else '' }}"
                          position: [32, 38]
                          font: PICO_8
                          color: [255, 235, 200]
                          align: center
                        - type: text
                          content: "{{ done_lines[2] if done_lines | count > 2 else '' }}"
                          position: [32, 45]
                          font: PICO_8
                          color: [255, 235, 200]
                          align: center
                        - type: text
                          content: "{% if (done.get('points') | int(0)) > 0 %}{{ done.get('points') }} QP{% endif %}"
                          position: [2, 57]
                          font: PICO_8
                          color: "{{ accent }}"
                        - type: text
                          content: "{{ quest_count }}"
                          position: [62, 57]
                          font: PICO_8
                          color: [200, 170, 120]
                          align: right
                - delay:
                    seconds: "{{ floor }}"

      # ----------------------------------------------------------------- quest
      # The quest you are on: while a step of it just landed, over whatever
      # XP is trickling in, and in place of the standby screen while one is in
      # progress and nothing is training. A quest grants no XP until it is
      # done, so this is the only screen a quester would otherwise get.
      #
      # No health or prayer here, on purpose: nothing about a quest step says
      # you are in a fight, and the room goes to the quest instead. Top half
      # is you -- quest points and where this quest is at -- and the bottom
      # half is the quest and how far through the quest list you are.
      - conditions: "{{ quest_screen and quest.get('in_progress') and (questing or active < 1) }}"
        sequence:
          - action: divoom_pixoo.show_message
            continue_on_error: true
            target:
              entity_id: !input panel
            data:
              page_data:
                page_type: components
                components:
                  - type: rectangle
                    position: [0, 0]
                    size: [64, 64]
                    color: "{{ bg }}"
                    filled: true
                  - type: image
                    image_path: "{{ state_attr(activity, 'quest_icon') }}"
                    position: [0, 1]
                    resample_mode: nearest
                  - type: text
                    content: "{{ quest.get('points') | int(0) }}"
                    position: [28, 3]
                    font: ELEVEN_PIX
                    color: [255, 215, 0]
                  - type: text
                    content: QP
                    position: [62, 9]
                    font: PICO_8
                    color: "{{ accent }}"
                    align: right
                  # The stage is the quest's own progress variable, not a step
                  # count -- it jumps 10, 20, 30 on most quests and has no
                  # known end. What it is good for is showing that something
                  # just moved.
                  - type: text
                    content: "{% if idle %}IDLE{% else %}STAGE {{ quest.get('stage') | int(0) }}{% endif %}"
                    position: [28, 18]
                    font: PICO_8
                    color: "{% if idle %}[255,180,0]{% else %}[140,200,255]{% endif %}"
                  - type: rectangle
                    position: [0, 26]
                    size: [64, 1]
                    color: [90, 74, 54]
                    filled: true
                  - type: text
                    content: "{{ quest_lines[0] if quest_lines | count > 0 else '' }}"
                    position: [2, 30]
                    font: PICO_8
                    color: [255, 235, 200]
                  - type: text
                    content: "{{ quest_lines[1] if quest_lines | count > 1 else '' }}"
                    position: [2, 37]
                    font: PICO_8
                    color: [255, 235, 200]
                  - type: text
                    content: "{{ quest_lines[2] if quest_lines | count > 2 else '' }}"
                    position: [2, 44]
                    font: PICO_8
                    color: [255, 235, 200]
                  - type: rectangle
                    position: [2, 51]
                    size: [60, 3]
                    color: [72, 60, 44]
                    filled: true
                  - type: rectangle
                    position: [2, 51]
                    size: ["{{ [ ((quest.get('pct') | int(0)) * 0.6) | round | int, 1 ] | max }}", 3]
                    color: "{{ accent }}"
                    filled: true
                  - type: text
                    content: "{{ quest_count }}"
                    position: [2, 57]
                    font: PICO_8
                    color: [200, 170, 120]
                  - type: text
                    content: "{% if (quest.get('total') | int(0)) > 0 %}{{ quest.get('pct') | int(0) }}%{% endif %}"
                    position: [62, 57]
                    font: PICO_8
                    color: [140, 120, 90]
                    align: right

      # ---------------------------------------------------------------- combat
      # Everything gaining XP is a combat skill. The heading is the attack
      # style, which is read off from which of attack/strength/defence are
      # ticking -- or the slayer task, because you know what weapon you are
      # holding and you cannot see what you are killing or how much is left.
      - conditions: "{{ combat }}"
        sequence:
          - action: divoom_pixoo.show_message
            # The Pixoo reboots by itself now and then -- it refuses the
            # connection for about half a minute and comes back on its own.
            # A missed frame is not worth a stack trace or an aborted run.
            continue_on_error: true
            target:
              entity_id: !input panel
            data:
              page_data:
                page_type: components
                components:
                  - type: rectangle
                    position: [0, 0]
                    size: [64, 64]
                    color: "{{ bg }}"
                    filled: true
                  - type: rectangle
                    position: [0, 0]
                    size: ["{{ [ [ ((hp_pct | int(0)) * 0.64) | round | int, 1 ] | max, 64 ] | min }}", 2]
                    color: "{{ hp_color }}"
                    filled: true
                  - type: text
                    content: "{{ state_attr(activity, 'style') }}"
                    position: [2, 5]
                    font: PICO_8
                    color: "{{ accent }}"
                  # How many of the task are left, which is the number the
                  # game gives you and the one the heading beside it names.
                  # Without a task, the kills guessed from the XP, marked with
                  # an x because that one counts up rather than down.
                  - type: text
                    content: "{% if task_left > 0 %}{{ task_left }}{% elif task_kills > 0 %}x{{ task_kills }}{% endif %}"
                    position: [62, 5]
                    font: PICO_8
                    color: [150, 150, 160]
                    align: right
                  - type: rectangle
                    position: [0, 13]
                    size: [64, 1]
                    color: [90, 74, 54]
                    filled: true
                  - type: image
                    image_path: "{{ state_attr(activity, 'style_icon') }}"
                    position: [38, 16]
                    resample_mode: nearest
                  - type: text
                    content: "+{{ gained }} XP"
                    position: [2, 19]
                    font: PICO_8
                    color: [255, 220, 0]
                  - type: rectangle
                    position: [0, 27]
                    size: [36, 10]
                    color: "{% if idle %}[255,180,0]{% else %}{{ bg }}{% endif %}"
                    filled: true
                  - type: text
                    content: "{% if idle %}IDLE{% else %}{{ (per_hour / 1000) | round(1) }}k/HR{% endif %}"
                    position: [2, 30]
                    font: PICO_8
                    color: "{% if idle %}[60,45,10]{% else %}[200,170,120]{% endif %}"
                  - type: text
                    content: HP
                    position: [2, 45]
                    font: PICO_8
                    color: [200, 170, 120]
                  - type: rectangle
                    position: [22, 44]
                    size: [40, 7]
                    color: [72, 60, 44]
                    filled: true
                  - type: rectangle
                    position: [22, 44]
                    size: ["{{ [ [ ((hp_pct | int(0)) * 0.4) | round | int, 1 ] | max, 40 ] | min }}", 7]
                    color: "{{ hp_color }}"
                    filled: true
                  - type: text
                    content: PRAY
                    position: [2, 55]
                    font: PICO_8
                    color: [200, 170, 120]
                  - type: rectangle
                    position: [22, 54]
                    size: [40, 7]
                    color: [72, 60, 44]
                    filled: true
                  - type: rectangle
                    position: [22, 54]
                    size: ["{{ [ [ ((pray_pct | int(0)) * 0.4) | round | int, 1 ] | max, 40 ] | min }}", 7]
                    color: "{% if (pray_pct | int(-1)) < 0 %}{{ bg }}{% else %}[140,200,255]{% endif %}"
                    filled: true

      # ---------------------------------------------------------- single skill
      # One thing at a time: the name, what you have gained, the rate, and how
      # far the bar has to go to the next level.
      - conditions: "{{ focus_n == 1 }}"
        sequence:
          - action: divoom_pixoo.show_message
            # The Pixoo reboots by itself now and then -- it refuses the
            # connection for about half a minute and comes back on its own.
            # A missed frame is not worth a stack trace or an aborted run.
            continue_on_error: true
            target:
              entity_id: !input panel
            data:
              page_data:
                page_type: components
                components:
                  - type: rectangle
                    position: [0, 0]
                    size: [64, 64]
                    color: "{{ bg }}"
                    filled: true
                  - type: rectangle
                    position: [0, 0]
                    size: ["{{ [ [ ((hp_pct | int(0)) * 0.64) | round | int, 1 ] | max, 64 ] | min }}", 2]
                    color: "{{ hp_color }}"
                    filled: true
                  - type: text
                    content: "{{ (top.key | default('')) | upper }}"
                    position: [2, 5]
                    font: PICO_8
                    color: "{% if idle %}[120,105,80]{% else %}{{ top.color | default(accent, true) }}{% endif %}"
                  - type: text
                    content: "{{ top.level | default('') }}"
                    position: [62, 5]
                    font: PICO_8
                    color: [200, 170, 120]
                    align: right
                  - type: rectangle
                    position: [0, 13]
                    size: [64, 1]
                    color: [90, 74, 54]
                    filled: true
                  - type: image
                    image_path: "{{ top.icon_path }}"
                    position: [38, 16]
                    resample_mode: nearest
                  - type: text
                    content: "+{{ top.gained_short | default('0') }} XP"
                    position: [2, 18]
                    font: PICO_8
                    color: [255, 220, 0]
                  - type: rectangle
                    position: [0, 27]
                    size: [36, 10]
                    color: "{% if idle %}[255,180,0]{% else %}{{ bg }}{% endif %}"
                    filled: true
                  - type: text
                    content: "{% if idle %}IDLE{% else %}{{ top.per_hour_short | default('0') }}/HR{% endif %}"
                    position: [2, 29]
                    font: PICO_8
                    color: "{% if idle %}[60,45,10]{% else %}[200,170,120]{% endif %}"
                  - type: rectangle
                    position: [2, 47]
                    size: [60, 6]
                    color: [72, 60, 44]
                    filled: true
                  - type: rectangle
                    position: [2, 47]
                    size: ["{{ [ ((top.pct | default(0) | float(0)) * 0.6) | round | int, 1 ] | max }}", 6]
                    color: "{{ top.color | default(accent, true) }}"
                    filled: true
                  - type: text
                    content: "{{ top.xp_short | default('') }}"
                    position: [2, 56]
                    font: PICO_8
                    color: [200, 170, 120]
                  - type: text
                    content: "{% if top.next_level | default(none) %}L{{ top.next_level }}{% endif %}"
                    position: [62, 56]
                    font: PICO_8
                    color: [140, 120, 90]
                    align: right

      # ------------------------------------------------------- standby
      # Logged in, nothing training. Your name and your bars, so the panel
      # says something between sessions instead of going blank.
      - conditions: "{{ active < 1 }}"
        sequence:
          - action: divoom_pixoo.show_message
            # The Pixoo reboots by itself now and then -- it refuses the
            # connection for about half a minute and comes back on its own.
            # A missed frame is not worth a stack trace or an aborted run.
            continue_on_error: true
            target:
              entity_id: !input panel
            data:
              page_data:
                page_type: components
                components:
                  - type: rectangle
                    position: [0, 0]
                    size: [64, 64]
                    color: "{{ bg }}"
                    filled: true
                  - type: rectangle
                    position: [0, 0]
                    size: ["{{ [ [ ((hp_pct | int(0)) * 0.64) | round | int, 1 ] | max, 64 ] | min }}", 2]
                    color: "{{ hp_color }}"
                    filled: true
                  - type: text
                    content: "{{ account }}"
                    position: [2, 5]
                    font: PICO_8
                    color: "{{ accent }}"
                  - type: rectangle
                    position: [0, 13]
                    size: [64, 1]
                    color: [90, 74, 54]
                    filled: true
                  - type: text
                    content: "{% if idle %}IDLE{% else %}ONLINE{% endif %}"
                    position: [2, 22]
                    font: PICO_8
                    color: "{% if idle %}[255,180,0]{% else %}[140,200,255]{% endif %}"
                  - type: text
                    content: HP
                    position: [2, 45]
                    font: PICO_8
                    color: [200, 170, 120]
                  - type: rectangle
                    position: [22, 44]
                    size: [40, 7]
                    color: [72, 60, 44]
                    filled: true
                  - type: rectangle
                    position: [22, 44]
                    size: ["{{ [ [ ((hp_pct | int(0)) * 0.4) | round | int, 1 ] | max, 40 ] | min }}", 7]
                    color: "{{ hp_color }}"
                    filled: true
                  - type: text
                    content: PRAY
                    position: [2, 55]
                    font: PICO_8
                    color: [200, 170, 120]
                  - type: rectangle
                    position: [22, 54]
                    size: [40, 7]
                    color: [72, 60, 44]
                    filled: true
                  - type: rectangle
                    position: [22, 54]
                    size: ["{{ [ [ ((pray_pct | int(0)) * 0.4) | round | int, 1 ] | max, 40 ] | min }}", 7]
                    color: "{% if (pray_pct | int(-1)) < 0 %}{{ bg }}{% else %}[140,200,255]{% endif %}"
                    filled: true

    # ------------------------------------------------------------------- bars
    # Anything else: up to five skills, each with a bar scaled against the
    # biggest gainer. Five rows is what fits at 9px a row, and the heading says
    # "+2" when there are more.
    default:
      - action: divoom_pixoo.show_message
        continue_on_error: true
        target:
          entity_id: !input panel
        data:
          page_data:
            page_type: components
            components:
              - type: rectangle
                position: [0, 0]
                size: [64, 64]
                color: "{{ bg }}"
                filled: true
              - type: rectangle
                position: [0, 0]
                size: ["{{ [ [ ((hp_pct | int(0)) * 0.64) | round | int, 1 ] | max, 64 ] | min }}", 2]
                color: "{{ hp_color }}"
                filled: true
              - type: text
                content: "{% if idle %}IDLE{% else %}XP{% if active > 5 %} +{{ active - 5 }}{% endif %}{% endif %}"
                position: [2, 5]
                font: PICO_8
                color: "{% if idle %}[255,180,0]{% else %}{{ accent }}{% endif %}"
              - type: text
                content: "+{{ gained }}"
                position: [62, 5]
                font: PICO_8
                color: [200, 170, 120]
                align: right
              - type: rectangle
                position: [0, 13]
                size: [64, 1]
                color: [90, 74, 54]
                filled: true

              - type: text
                content: "{{ rows[0].label if rows | count > 0 else '' }}"
                position: [2, 17]
                font: PICO_8
                color: "{{ accent }}"
              - type: rectangle
                position: [20, 16]
                size: [20, 7]
                color: "{% if rows | count > 0 %}[72,60,44]{% else %}{{ bg }}{% endif %}"
                filled: true
              - type: rectangle
                position: [20, 16]
                size: ["{{ [ ((rows[0].share | float(0)) * 0.2) | round | int, 1 ] | max if rows | count > 0 else 1 }}", 7]
                color: "{{ rows[0].color if rows | count > 0 else bg }}"
                filled: true
              - type: text
                content: "{{ rows[0].gained_short if rows | count > 0 else '' }}"
                position: [62, 17]
                font: PICO_8
                color: [200, 170, 120]
                align: right

              - type: text
                content: "{{ rows[1].label if rows | count > 1 else '' }}"
                position: [2, 26]
                font: PICO_8
                color: [200, 170, 120]
              - type: rectangle
                position: [20, 25]
                size: [20, 7]
                color: "{% if rows | count > 1 %}[72,60,44]{% else %}{{ bg }}{% endif %}"
                filled: true
              - type: rectangle
                position: [20, 25]
                size: ["{{ [ ((rows[1].share | float(0)) * 0.2) | round | int, 1 ] | max if rows | count > 1 else 1 }}", 7]
                color: "{{ rows[1].color if rows | count > 1 else bg }}"
                filled: true
              - type: text
                content: "{{ rows[1].gained_short if rows | count > 1 else '' }}"
                position: [62, 26]
                font: PICO_8
                color: [140, 120, 90]
                align: right

              - type: text
                content: "{{ rows[2].label if rows | count > 2 else '' }}"
                position: [2, 35]
                font: PICO_8
                color: [200, 170, 120]
              - type: rectangle
                position: [20, 34]
                size: [20, 7]
                color: "{% if rows | count > 2 %}[72,60,44]{% else %}{{ bg }}{% endif %}"
                filled: true
              - type: rectangle
                position: [20, 34]
                size: ["{{ [ ((rows[2].share | float(0)) * 0.2) | round | int, 1 ] | max if rows | count > 2 else 1 }}", 7]
                color: "{{ rows[2].color if rows | count > 2 else bg }}"
                filled: true
              - type: text
                content: "{{ rows[2].gained_short if rows | count > 2 else '' }}"
                position: [62, 35]
                font: PICO_8
                color: [140, 120, 90]
                align: right

              - type: text
                content: "{{ rows[3].label if rows | count > 3 else '' }}"
                position: [2, 44]
                font: PICO_8
                color: [200, 170, 120]
              - type: rectangle
                position: [20, 43]
                size: [20, 7]
                color: "{% if rows | count > 3 %}[72,60,44]{% else %}{{ bg }}{% endif %}"
                filled: true
              - type: rectangle
                position: [20, 43]
                size: ["{{ [ ((rows[3].share | float(0)) * 0.2) | round | int, 1 ] | max if rows | count > 3 else 1 }}", 7]
                color: "{{ rows[3].color if rows | count > 3 else bg }}"
                filled: true
              - type: text
                content: "{{ rows[3].gained_short if rows | count > 3 else '' }}"
                position: [62, 44]
                font: PICO_8
                color: [140, 120, 90]
                align: right

              - type: text
                content: "{{ rows[4].label if rows | count > 4 else '' }}"
                position: [2, 53]
                font: PICO_8
                color: [200, 170, 120]
              - type: rectangle
                position: [20, 52]
                size: [20, 7]
                color: "{% if rows | count > 4 %}[72,60,44]{% else %}{{ bg }}{% endif %}"
                filled: true
              - type: rectangle
                position: [20, 52]
                size: ["{{ [ ((rows[4].share | float(0)) * 0.2) | round | int, 1 ] | max if rows | count > 4 else 1 }}", 7]
                color: "{{ rows[4].color if rows | count > 4 else bg }}"
                filled: true
              - type: text
                content: "{{ rows[4].gained_short if rows | count > 4 else '' }}"
                position: [62, 53]
                font: PICO_8
                color: [140, 120, 90]
                align: right

  # The floor, and the reason this script runs queued rather than single: a
  # rate limit may delay a render, it may not forget one. Dropping the trigger
  # is how IDLE ends up arriving a minute late. The celebration paces its
  # own frames on the same floor and skips this one.
  - if: "{{ not celebrating }}"
    then:
      - delay:
          seconds: "{{ floor }}"
